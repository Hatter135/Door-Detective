<!DOCTYPE html>
<html lang="en">
<!--Creates the webpage-->
<head>

<link rel="manifest" href="manifest.json?v=8">
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js?v=8');
    }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Detective: Web Edition</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="you-win">
        <h1>You Win!</h1>
    </div>

    <div id="Yippie">
        <h1>Yippie!</h1>
    </div>

    <div class="image-container">


    <button onclick="startListening()">Start Listening</button>
    <button onclick="stopListening()">Stop Listening</button>
    <button id="help-button" onclick="showHelp()">Help</button>
    <p id="awaiting"></p>
    <p id="output"></p>

    <div id="help-panel" class="help-panel">
        <h2>Available Commands</h2>
        <ul id="help-list"></ul>
    </div>

    <div class="images"> 

        <img src="images/game-stuff/start-menu/door-detective-start-menu.png" alt="Menu Image" id="menu-image">
        <img src="images/middle-room/middle-room.png" alt="Main Room" id="main-room-image">

        
        <img src="images/middle-room/computer/computer-mk2.png" alt="Computer" id="computer-image">
        <img src="images/middle-room/computer/computer-booting-up.png" alt="Computer" id="computer-image-booting">
        <img src="images/middle-room/computer/computer-login.png" alt="Computer Screen" id="computer-image-login">
        <img src="images/middle-room/computer/computer-new-mail.png" alt="Computer Screen" id="computer-image-mail">
        <img src="images/middle-room/computer/email-dialog-01.png" alt="Email Dialog" id="computer-mail-01">
        <img src="images/middle-room/computer/email-dialog-02.png" alt="Email Dialog" id="computer-mail-02">
        <img src="images/middle-room/computer/computer-error.png" alt="Computer Error" id="computer-error">
        <img src="images/middle-room/computer/computer-login-error.png" alt="computer-login-error" id="computer-login-error">

        <img src="images/middle-room/right-room/right-room-bathroom.png" alt="bathroom" id="bathroom-image">
        <img src="images/middle-room/right-room/toilet.png" alt="Toilet" id="toilet-image">
        <img src="images/middle-room/right-room/wall.png" alt="Wall" id="wall-image">
        <img src="images/middle-room/right-room/shower.png" alt="Shower" id="shower-image">

        <img src="images/middle-room/middle-door.png" alt="Middle Door with Keypad" id="middle-door-image">
        <img src="images/middle-room/keypad.png" alt="keypad" id="keypad-image">
        <video id="celibration" autoplay muted loop >
            
            <source src="video/celebration-fixed.mp4" type="video/mp4" >
            Your browser does not support the video tag.
        </video>
    </div>
    </div>

</body>

    <script src="script.js"></script>

</html>
